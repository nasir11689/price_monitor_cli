name: Python SDLC Pipeline

on: [push, pull_request] # Runs every time you push code

jobs:
  test-and-build:
    runs-on: ubuntu-latest # The "Cloud" environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock

    - name: Run Tests
      run: |
        pytest # If this fails, the whole build stops!

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t my-crypto-tool .